<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Ticket</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><a class="logo" href="/">🍿 Cine<span>Book</span></a><a href="/">Home</a></nav><main class="ticket"><div class="ticketcard"><small>BOOKING CONFIRMED</small><h1>🎉 Your Movie Ticket</h1><span class="confirmed">✓ CONFIRMED</span><div class="code">{{booking.booking_code}}</div><div class="td"><div><small>MOVIE</small><h2>{{movie.title}}</h2><p>{{movie.genre}}</p></div><div><small>DATE & TIME</small><h3>{{show.date}}</h3><p>{{show.time}} · {{show.screen}}</p></div><div><small>SEATS</small><h3>{{booking.seats}}</h3></div></div><hr><p><b>{{booking.customer_name}}</b> · {{booking.email}} · <b>₹{{booking.total}}</b></p><button class="btn" onclick="print()">🖨 Print Ticket</button><a class="btn muted" href="/">Back Home</a></div></main></body></html>
